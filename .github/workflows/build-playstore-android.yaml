name: Build Playstore Android
on: [workflow_call]
permissions:
  contents: read
jobs:
  build:
    name: Generate App Bundle
    env:
      GITHUB_USERNAME: ${{ secrets.USERNAME_GITHUB }}
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Gradle rights
        run: chmod +x gradlew

      - name: Bundle 'googleRelease' with Gradle
        run: ./gradlew bundleGoogleRelease -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName | tail -1)
          VERSION_CODE=$(./gradlew -q printPlayStoreVersionCode | tail -1)
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_PLAYSTORE_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Sign AAB
        id: sign_aab
        env:
          SIGNING_PLAYSTORE_STORE_PASSWORD: ${{ secrets.SIGNING_PLAYSTORE_STORE_PASSWORD }}
          SIGNING_PLAYSTORE_KEY_PASSWORD: ${{ secrets.SIGNING_PLAYSTORE_KEY_PASSWORD }}
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass:env SIGNING_PLAYSTORE_STORE_PASSWORD \
            -keypass:env SIGNING_PLAYSTORE_KEY_PASSWORD \
            -signedjar app-google-release-signed.aab \
            app/build/outputs/bundle/googleRelease/app-google-release.aab \
            "${{ secrets.SIGNING_PLAYSTORE_KEY_ALIAS }}"

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

      - run: echo "Build status report=${{ job.status }}."

      - name: Upload App Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pia-playstore-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app-google-release-signed.aab
          if-no-files-found: error

      - name: Upload Mapping File
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pia-playstore-release-mapping-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/mapping/googleRelease/mapping.txt
          if-no-files-found: error
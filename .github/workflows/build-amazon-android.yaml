name: Build Amazon Android
on:
  workflow_call:
    secrets:
      USERNAME_GITHUB:
        required: true
      TOKEN_GITHUB:
        required: true
      SIGNING_WEB_KEYSTORE:
        required: true
      SIGNING_WEB_STORE_PASSWORD:
        required: true
      SIGNING_WEB_KEY_PASSWORD:
        required: true
      SIGNING_WEB_KEY_ALIAS:
        required: true
    outputs:
      full_version:
        description: "<versionName>.<nonPlayStoreVersionCode>, the version the Kape Artifact Store records for this APK"
        value: ${{ jobs.build.outputs.full_version }}
      artifact_name:
        description: "GitHub artifact holding the signed APK"
        value: ${{ jobs.build.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  build:
    name: Generate APK
    env:
      GITHUB_USERNAME: ${{ secrets.USERNAME_GITHUB }}
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Gradle rights
        run: chmod +x gradlew

      - name: Assemble 'amazonRelease' with Gradle
        run: ./gradlew assembleAmazonRelease -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName | tail -1)
          VERSION_CODE=$(./gradlew -q printNonPlayStoreVersionCode | tail -1)
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION_NAME}.${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "artifact_name=pia-amazon-release-${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_OUTPUT
          # Kape Artifact Store matches release builds by file name: <app>_<platform>_<version>_<channel>_<target>.<ext>
          echo "signed_file=privateinternetaccess_android_${VERSION_NAME}.${VERSION_CODE}_release_amazon.apk" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_WEB_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Sign APK
        id: sign_apk
        env:
          SIGNING_WEB_STORE_PASSWORD: ${{ secrets.SIGNING_WEB_STORE_PASSWORD }}
          SIGNING_WEB_KEY_PASSWORD: ${{ secrets.SIGNING_WEB_KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass env:SIGNING_WEB_STORE_PASSWORD \
            --key-pass env:SIGNING_WEB_KEY_PASSWORD \
            --ks-key-alias "${{ secrets.SIGNING_WEB_KEY_ALIAS }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "${{ steps.version.outputs.signed_file }}" \
            app/build/outputs/apk/amazon/release/app-amazon-release-unsigned.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

      - run: echo "Build status report=${{ job.status }}."

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.signed_file }}
          if-no-files-found: error
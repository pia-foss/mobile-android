name: Build Website Android
on:
  workflow_call:
    secrets:
      USERNAME_GITHUB:
        required: true
      TOKEN_GITHUB:
        required: true
      SIGNING_WEB_KEYSTORE:
        required: true
      SIGNING_WEB_STORE_PASSWORD:
        required: true
      SIGNING_WEB_KEY_PASSWORD:
        required: true
      SIGNING_WEB_KEY_ALIAS:
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Generate APK
    env:
      GITHUB_USERNAME: ${{ secrets.USERNAME_GITHUB }}
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Gradle rights
        run: chmod +x gradlew

      - name: Assemble 'noinappRelease' with Gradle
        run: ./gradlew assembleNoinappRelease -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName | tail -1)
          VERSION_CODE=$(./gradlew -q printNonPlayStoreVersionCode | tail -1)
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_WEB_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Sign APK
        id: sign_apk
        env:
          SIGNING_WEB_STORE_PASSWORD: ${{ secrets.SIGNING_WEB_STORE_PASSWORD }}
          SIGNING_WEB_KEY_PASSWORD: ${{ secrets.SIGNING_WEB_KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass env:SIGNING_WEB_STORE_PASSWORD \
            --key-pass env:SIGNING_WEB_KEY_PASSWORD \
            --ks-key-alias "${{ secrets.SIGNING_WEB_KEY_ALIAS }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app-noinapp-release-signed.apk \
            app/build/outputs/apk/noinapp/release/app-noinapp-release-unsigned.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks

      - run: echo "Build status report=${{ job.status }}."

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pia-website-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app-noinapp-release-signed.apk
          if-no-files-found: error
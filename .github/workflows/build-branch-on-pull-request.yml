name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write   # required for Gradle cache write (setup-java cache: gradle)

jobs:
  build:
    name: Build PR APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unique build ID
        id: build_id
        run: |
          # Slugify the branch name: lowercase, replace non-alphanumeric with hyphens, trim trailing hyphens
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-\|-$//g' \
            | cut -c1-40)

          BUILD_ID="pr-${{ github.event.pull_request.number }}-${BRANCH_SLUG}"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "Build ID: ${BUILD_ID}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify dependency verification metadata is up to date
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITTED_HASH=$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)
          cp gradle/verification-metadata.xml /tmp/verification-metadata.committed.xml
          ./gradlew --write-verification-metadata sha256 help ktlintCheck testGoogleDebugUnitTest testDebugUnitTest assembleGoogleDebug --no-daemon
          REGENERATED_HASH=$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)
          if [ "$COMMITTED_HASH" != "$REGENERATED_HASH" ]; then
            echo "::error::gradle/verification-metadata.xml is out of date (a task's dependency classpath resolved artifacts not in the committed metadata)."
            echo "Diff between committed and regenerated metadata:"
            diff /tmp/verification-metadata.committed.xml gradle/verification-metadata.xml || true
            echo "Run './gradlew --write-verification-metadata sha256 help ktlintCheck testGoogleDebugUnitTest testDebugUnitTest assembleGoogleDebug', review the diff, and commit the result."
            exit 1
          fi

      - name: Build debug APK
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleGoogleDebug --no-daemon

      - name: Rename APK with build ID
        run: |
          APK_PATH=$(find app/build/outputs/apk/google/debug -name "*.apk" | head -1)
          APK_DIR=$(dirname "$APK_PATH")
          mv "$APK_PATH" "${APK_DIR}/${{ steps.build_id.outputs.build_id }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_id.outputs.build_id }}
          path: app/build/outputs/apk/google/debug/${{ steps.build_id.outputs.build_id }}.apk
          retention-days: 7
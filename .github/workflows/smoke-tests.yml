name: Smoke tests

# Manual-only: Actions tab -> "Smoke tests" -> "Run workflow" (pick the branch to test).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write    # required for cache write

jobs:
  build-e2e-apk:
    name: Build E2E test APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup JAVA 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false   # write so the smoke-testing matrix jobs can read a warm build cache

      # All smoke-testing matrix legs build this exact same noinapp debug + androidTest variant
      # (they only differ by which test class they filter to). Building it once here with the
      # Gradle build cache enabled means the matrix jobs hit cache on compile/dex/resource tasks
      # instead of redundantly rebuilding the app from scratch in every leg.
      - name: Build E2E APKs
        env:
          GITHUB_USERNAME: ${{ secrets.USERNAME_GITHUB }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: ./gradlew :app:assembleNoinappDebug :app:assembleNoinappDebugAndroidTest

  # Populates the AVD snapshot cache with no secrets in the job environment at all, so a
  # compromised reactivecircus/android-emulator-runner invocation while creating the snapshot
  # has nothing to exfiltrate. See assembleDebug.yml for the full rationale.
  warm-avd-cache:
    name: Warm AVD snapshot cache
    runs-on: ubuntu-latest
    steps:
      - name: Enable Hardware Acceleration (Add KVM group perms)
        run: |
          sudo modprobe kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same key as assembleDebug.yml so both workflows share one AVD cache entry.
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-x86_64-pixel_4-v3

      - name: Create AVD for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_4
          cores: 2
          disk-size: 4G
          ram-size: 4096M
          emulator-boot-timeout: 480
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: false
          script: echo "Generated AVD for caching."

  smoke-testing:
    name: Run smoke tests (${{ matrix.test-class }})
    needs: [build-e2e-apk, warm-avd-cache]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-class:
          - DedicatedIpTests
          - E2ETests
          - HelpSettingsTests
          - LoginTests
          - LogoutTests
          - ProtocolTests
          - QuickConnectTests
          - QuickSettingsTests
          - RegionLatencyRefreshTests
          - SideMenuTests
          - WireGuardLocationTests
          - OpenVpnEncryptionTests
    steps:
      - name: Checkout the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup JAVA 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable Hardware Acceleration (Add KVM group perms)
        run: |
          sudo modprobe kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Populated by warm-avd-cache above. Must match the key there exactly.
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-x86_64-pixel_4-v3

      # PIA_VALID_* are passed inline to the one command that needs them rather than in this
      # step's env:, so they aren't exposed to the reactivecircus/android-emulator-runner action
      # itself (or anything else this step runs) — only to the ./gradlew process.
      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GITHUB_USERNAME: ${{ secrets.USERNAME_GITHUB }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_4
          cores: 2
          disk-size: 4G
          ram-size: 4096M
          emulator-boot-timeout: 480
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            PIA_VALID_USERNAME="${{ secrets.PIA_VALID_USERNAME }}" PIA_VALID_PASSWORD="${{ secrets.PIA_VALID_PASSWORD }}" PIA_VALID_DIP_TOKEN="${{ secrets.PIA_VALID_DIP_TOKEN }}" ./gradlew :app:connectedNoinappDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=e2e.${{ matrix.test-class }}

      - name: Upload smoke test report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: smoke-report-${{ matrix.test-class }}
          path: ${{ github.workspace }}/app/build/reports/androidTests/connected/debug/flavors/noinapp/*
          overwrite: true
